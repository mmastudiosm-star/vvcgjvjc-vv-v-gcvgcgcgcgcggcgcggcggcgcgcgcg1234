<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lreporter</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
  :root { --bg: #050810; --bg-secondary: #0a0f1c; --glass-bg: rgba(18, 26, 43, 0.6); --glass-border: rgba(255, 255, 255, 0.08); --text-main: #f0f4f8; --text-muted: #8b9bb4; --accent-blue: #3b82f6; --accent-cyan: #06b6d4; --accent-red: #ef4444; --accent-gold: #f59e0b; --accent-green: #10b981; --gradient-main: linear-gradient(135deg, #3b82f6, #8b5cf6); --base-font-size: 16px; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Vazirmatn', sans-serif; background: var(--bg); color: var(--text-main); min-height: 100vh; }
  header { position: sticky; top: 0; z-index: 100; background: rgba(5,8,16,0.8); backdrop-filter: blur(20px); border-bottom: 1px solid var(--glass-border); }
  .header-inner { max-width: 1400px; margin: 0 auto; padding: 16px 24px; display: flex; align-items: center; gap: 16px; }
  .logo { font-weight: 900; font-size: 1.6rem; color: var(--accent-blue); }
  .search-box { flex: 1; }
  .search-box input { width: 100%; padding: 14px 20px; background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 16px; color: var(--text-main); }
  .header-actions { display: flex; gap: 8px; }
  .icon-btn { background: var(--glass-bg); border: 1px solid var(--glass-border); color: var(--text-main); width: 44px; height: 44px; border-radius: 16px; cursor: pointer; font-size: 18px; position: relative; }
  .icon-btn .badge { position: absolute; top: -6px; right: -6px; background: var(--accent-red); color: #fff; font-size: 10px; padding: 2px 7px; border-radius: 12px; }
  
  .grid { max-width: 1400px; margin: 20px auto; padding: 0 24px; display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 24px; }
  .card { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 24px; overflow: hidden; display: flex; flex-direction: column; cursor: pointer; position: relative; }
  .card.featured { border: 2px solid var(--accent-gold); box-shadow: 0 0 20px rgba(245,158,11,0.3); }
  .card-img-wrap { height: 200px; background: #0f1525; }
  .card-img { width: 100%; height: 100%; object-fit: cover; }
  .card-body { padding: 20px; display: flex; flex-direction: column; gap: 10px; }
  .source-tag { font-size: 11px; color: #fff; background: var(--gradient-main); padding: 4px 10px; border-radius: 10px; width: fit-content; }
  .source-tag.featured { background: linear-gradient(135deg, #f59e0b, #fbbf24); color: #000; font-weight: bold; }
  .card h2 { font-size: 1.1rem; }
  .card p { font-size: 0.9rem; color: var(--text-muted); }
  .skeleton { height: 380px; background: var(--glass-bg); border-radius: 24px; border: 1px solid var(--glass-border); animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 0.3; } }
  
  .modal-overlay { position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--bg-secondary); padding: 30px; border-radius: 24px; max-width: 600px; width: 90%; max-height: 90vh; overflow-y: auto; }
  .toast { position: fixed; bottom: 20px; right: 20px; background: var(--glass-bg); border: 2px solid var(--accent-blue); padding: 15px 25px; border-radius: 12px; z-index: 9999; font-weight: bold; animation: slideIn 0.3s; }
  @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">Lreporter</div>
    <div class="search-box"><input type="text" id="searchInput" placeholder="جستجو..."></div>
    <div class="header-actions">
      <button class="icon-btn" id="notifBtn" title="پیام‌ها">🔔<span class="badge" id="notifBadge" style="display:none">0</span></button>
      <button class="icon-btn" id="userBtn" title="پروفایل">👤</button>
      <button class="icon-btn" id="refreshBtn">🔄</button>
    </div>
  </div>
</header>

<div class="grid" id="content"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>

<!-- مودال پیام‌ها -->
<div class="modal-overlay" id="notifModal">
  <div class="modal">
    <h2 style="margin-bottom: 20px; color: var(--accent-blue);">🔔 پیام‌های شما</h2>
    <div id="notifList" style="display: flex; flex-direction: column; gap: 10px;"></div>
    <button onclick="document.getElementById('notifModal').classList.remove('open')" style="width: 100%; margin-top: 20px; padding: 10px; border-radius: 10px; background: var(--accent-blue); color: #fff; border: none; cursor: pointer;">بستن</button>
  </div>
</div>

<!-- مودال ورود -->
<div class="modal-overlay" id="authModal">
  <div class="modal">
    <h2 style="text-align: center; margin-bottom: 20px;">👤 ورود / ثبت‌نام</h2>
    <input type="text" id="authUsername" placeholder="نام کاربری..." style="width:100%; padding:12px; margin-bottom:10px; border-radius:8px; border:1px solid #ccc;">
    <input type="password" id="authPassword" placeholder="رمز عبور..." style="width:100%; padding:12px; margin-bottom:10px; border-radius:8px; border:1px solid #ccc;">
    <div style="display:flex; gap:10px;">
      <button id="loginBtn" style="flex:1; padding:12px; background:var(--accent-blue); color:#fff; border:none; border-radius:8px; cursor:pointer;">ورود</button>
      <button id="regBtn" style="flex:1; padding:12px; background:var(--accent-green); color:#fff; border:none; border-radius:8px; cursor:pointer;">ثبت‌نام</button>
    </div>
    <button onclick="document.getElementById('authModal').classList.remove('open')" style="width:100%; margin-top:15px; background:none; border:none; color:var(--text-muted); cursor:pointer;">انصراف</button>
  </div>
</div>

<script>
const SUPABASE_URL_AUTH = 'https://kemwkxuwhqgqqfyfpbmm.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_OsUd9T9GvvY6rvyycxlQSA_xFazoXBe';
const SUPABASE_URL = 'https://kemwkxuwhqgqqfyfpbmm.supabase.co/functions/v1/rapid-processor';
const MANUAL_NEWS_API = 'https://kemwkxuwhqgqqfyfpbmm.supabase.co/functions/v1/manual-news';
const HIDDEN_NEWS_URL = 'https://kemwkxuwhqgqqfyfpbmm.supabase.co/functions/v1/hidden-news';

const FAKE_EMAIL_DOMAIN = '@lreporter.local';
const supabaseClient = window.supabase.createClient(SUPABASE_URL_AUTH, SUPABASE_ANON_KEY);

let allNews = [];
let currentUser = null;
let lastCheckTime = new Date().toISOString();

document.addEventListener('DOMContentLoaded', async () => {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) { currentUser = session.user; document.getElementById('userBtn').textContent = '👋'; }
    
    loadAll();
    checkNotifications();
    setInterval(checkNotifications, 30000); 
});

document.getElementById('refreshBtn').onclick = loadAll;

async function loadAll() {
    const box = document.getElementById('content');
    box.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';
    
    try {
        const [resScraped, resManual, resHidden] = await Promise.all([
            fetch(SUPABASE_URL).then(r => r.json()).catch(() => []),
            fetch(MANUAL_NEWS_API).then(r => r.json()).catch(() => []),
            fetch(HIDDEN_NEWS_URL, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({action:'list'}) }).then(r => r.json()).catch(() => [])
        ]);

        // 🌟 ۱. اصلاح لیست اخبار مخفی
        const hiddenLinks = Array.isArray(resHidden) ? resHidden : [];
        let combined = [];

        // 🌟 ۲. پردازش اخبار دستی (با تبدیل قطعی is_featured به Boolean)
        if (Array.isArray(resManual)) {
            resManual.forEach(n => {
                if (!n.link) n.link = 'manual:' + (n._id || Date.now());
                n._manual = true;
                // تبدیل مقادیر رشته‌ای به بولین واقعی
                n.is_featured = (n.is_featured === true || n.is_featured === 'true');
                combined.push(n);
            });
        }

        // 🌟 ۳. پردازش اخبار سایت‌های دیگر (فیلتر کردن مخفی‌ها)
        if (Array.isArray(resScraped)) {
            resScraped.forEach(n => {
                // چک کردن اینکه لینک خبر در لیست مخفی‌ها نباشد
                if (n.link && !hiddenLinks.includes(n.link.trim())) {
                    n.is_featured = false; // اخبار سایت‌های دیگر ویژه نیستند
                    combined.push(n);
                }
            });
        }

        // 🌟 ۴. مرتب‌سازی دقیق: اول ویژه‌ها، بعد بقیه بر اساس تاریخ
        combined.sort((a, b) => {
            if (a.is_featured && !b.is_featured) return -1;
            if (!a.is_featured && b.is_featured) return 1;
            
            // استخراج تاریخ (بعضی اخبار pubDate دارند، بعضی date)
            const dateA = new Date(a.date || a.pubDate || 0).getTime();
            const dateB = new Date(b.date || b.pubDate || 0).getTime();
            return dateB - dateA;
        });

        allNews = combined;
        renderNews();
    } catch (e) { 
        console.error(e); 
        box.innerHTML = '<p>خطا در دریافت اخبار</p>'; 
    }
}

function renderNews() {
    const box = document.getElementById('content');
    if (!allNews.length) { box.innerHTML = '<p>خبری یافت نشد</p>'; return; }
    
    box.innerHTML = allNews.map((n, i) => {
        const isFeatured = n.is_featured === true;
        const img = n.image ? `<div class="card-img-wrap"><img class="card-img" src="${n.image}" onerror="this.parent.style.display='none'"></div>` : '';
        return `
        <div class="card ${isFeatured ? 'featured' : ''}">
            ${img}
            <div class="card-body">
                <div class="source-tag ${isFeatured ? 'featured' : ''}">${isFeatured ? '⭐ خبر ویژه' : (n.source || 'خبر')}</div>
                <h2>${n.title}</h2>
                <p>${n.summary || (n.plain ? n.plain.slice(0,100) : '')}</p>
            </div>
        </div>`;
    }).join('');
}

// سیستم پیام‌ها
async function checkNotifications() {
    let query = supabaseClient.from('notifications').select('*').gt('created_at', lastCheckTime);
    if (currentUser) {
        const username = currentUser.email.replace(FAKE_EMAIL_DOMAIN, '');
        query = query.or(`target_user.eq.all,target_user.eq.${username}`);
    } else {
        query = query.eq('target_user', 'all');
    }

    const { data } = await query;
    if (data && data.length > 0) {
        data.forEach(msg => showToast(`🔔 پیام جدید: ${msg.message}`));
        lastCheckTime = new Date().toISOString();
        const badge = document.getElementById('notifBadge');
        badge.style.display = 'block';
        badge.textContent = parseInt(badge.textContent || 0) + data.length;
    }
}

function showToast(msg) {
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 5000);
}

document.getElementById('notifBtn').onclick = async () => {
    document.getElementById('notifModal').classList.add('open');
    document.getElementById('notifBadge').style.display = 'none';
    
    let query = supabaseClient.from('notifications').select('*').order('created_at', { ascending: false }).limit(20);
    if (currentUser) {
        const username = currentUser.email.replace(FAKE_EMAIL_DOMAIN, '');
        query = query.or(`target_user.eq.all,target_user.eq.${username}`);
    } else {
        query = query.eq('target_user', 'all');
    }

    const { data } = await query;
    const list = document.getElementById('notifList');
    if (data && data.length > 0) {
        list.innerHTML = data.map(m => `<div style="padding: 10px; background: var(--glass-bg); border-radius: 10px;">${m.message}</div>`).join('');
    } else {
        list.innerHTML = '<p style="text-align:center; color:var(--text-muted);">پیامی ندارید.</p>';
    }
};

document.getElementById('userBtn').onclick = () => {
    if (currentUser) { if(confirm('خارج می‌شوید؟')) supabaseClient.auth.signOut().then(() => location.reload()); } 
    else { document.getElementById('authModal').classList.add('open'); }
};

document.getElementById('loginBtn').onclick = async () => {
    const u = document.getElementById('authUsername').value.trim();
    const p = document.getElementById('authPassword').value.trim();
    const { error } = await supabaseClient.auth.signInWithPassword({ email: u + FAKE_EMAIL_DOMAIN, password: p });
    if (error) alert('خطا: ' + error.message); else location.reload();
};

document.getElementById('regBtn').onclick = async () => {
    const u = document.getElementById('authUsername').value.trim();
    const p = document.getElementById('authPassword').value.trim();
    const { error } = await supabaseClient.auth.signUp({ email: u + FAKE_EMAIL_DOMAIN, password: p });
    if (error) alert('خطا: ' + error.message); else location.reload();
};
</script>
</body>
</html>
