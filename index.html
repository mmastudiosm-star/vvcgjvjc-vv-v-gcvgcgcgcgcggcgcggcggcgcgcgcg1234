<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت | Lreporter</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #050810; --card-bg: #0f1525; --text: #f0f4f8; --text-muted: #8b9bb4; --accent: #3b82f6; --danger: #ef4444; --success: #10b981; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Vazirmatn', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
        .hidden { display: none !important; }
        .login-container { display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: var(--card-bg); border-radius: 16px; padding: 30px; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; }
        .login-card { width: 100%; max-width: 400px; }
        .admin-container { max-width: 1000px; margin: 0 auto; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; background: var(--card-bg); padding: 15px 25px; border-radius: 16px; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: var(--text); padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 700; }
        .tab-btn.active { background: var(--accent); border-color: var(--accent); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 8px; font-weight: 700; font-size: 0.9rem; color: var(--text-muted); }
        input, textarea, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.3); color: var(--text); font-family: inherit; }
        button { padding: 12px 20px; border: none; border-radius: 8px; background: var(--accent); color: #fff; font-weight: 700; cursor: pointer; }
        .btn-danger { background: var(--danger); }
        .btn-sm { padding: 6px 12px; font-size: 0.8rem; }
        table { width: 100%; border-collapse: collapse; text-align: right; }
        th, td { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        th { background: rgba(0,0,0,0.3); color: var(--accent); }
        .toast { position: fixed; bottom: 20px; right: 20px; background: #0f1525; padding: 15px 25px; border-radius: 10px; font-weight: bold; z-index: 1000; border: 1px solid var(--accent); }
    </style>
</head>
<body>

    <div id="loginSection" class="login-container">
        <div class="card login-card">
            <h1 style="text-align: center; margin-bottom: 25px; color: var(--accent);">🔐 ورود به پنل</h1>
            <form id="loginForm">
                <input type="password" id="adminPassword" placeholder="رمز را وارد کنید..." required style="margin-bottom:15px;">
                <button type="submit" style="width: 100%;">ورود</button>
            </form>
        </div>
    </div>

    <div id="adminSection" class="admin-container hidden">
        <div class="header">
            <h1>📊 مدیریت Lreporter</h1>
            <button id="logoutBtn" class="btn-danger btn-sm">خروج</button>
        </div>

        <div class="tabs">
            <button class="tab-btn active" data-tab="add">➕ ثبت خبر</button>
            <button class="tab-btn" data-tab="list">📋 لیست اخبار</button>
            <button class="tab-btn" data-tab="users">👥 کاربران و پیام</button>
        </div>

        <!-- ثبت خبر -->
        <div id="tab-add" class="tab-content">
            <div class="card">
                <form id="addNewsForm">
                    <div class="form-group"><label>عنوان خبر *</label><input type="text" id="newsTitle" required></div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;">
                        <div class="form-group"><label>منبع</label><input type="text" id="newsSource" value="خبر دستی"></div>
                        <div class="form-group"><label>دسته</label><select id="newsCategory"><option>عمومی</option><option>سیاسی</option><option>اقتصاد</option></select></div>
                        <div class="form-group"><label>اهمیت</label><select id="newsFeatured"><option value="false">عادی</option><option value="true">⭐ ویژه</option></select></div>
                    </div>
                    <div class="form-group"><label>متن خبر *</label><textarea id="newsContent" required></textarea></div>
                    <button type="submit" style="width: 100%;">ثبت خبر</button>
                </form>
            </div>
        </div>

        <!-- لیست اخبار -->
        <div id="tab-list" class="tab-content hidden">
            <div class="card"><table><thead><tr><th>عنوان</th><th>نوع</th><th>عملیات</th></tr></thead><tbody id="newsTableBody"></tbody></table></div>
        </div>

        <!-- کاربران و پیام -->
        <div id="tab-users" class="tab-content hidden">
            <div class="card" style="margin-bottom: 20px;">
                <form id="sendNotifForm">
                    <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 10px;">
                        <div class="form-group"><label>گیرنده:</label><select id="notifTarget"><option value="all">همه</option></select></div>
                        <div class="form-group"><label>پیام:</label><input type="text" id="notifMessage" required></div>
                    </div>
                    <button type="submit" style="width: 100%;">ارسال پیام</button>
                </form>
            </div>
            <div class="card"><table><thead><tr><th>کاربر</th></tr></thead><tbody id="usersListBody"></tbody></table></div>
        </div>
    </div>

<script>
    const SUPABASE_URL = 'https://kemwkxuwhqgqqfyfpbmm.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_OsUd9T9GvvY6rvyycxlQSA_xFazoXBe';
    const BASE_URL = `${SUPABASE_URL}/functions/v1`;
    
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let adminToken = null;

    function showToast(msg, isError = false) {
        const t = document.createElement('div'); t.className = 'toast';
        t.style.borderColor = isError ? 'var(--danger)' : 'var(--success)'; t.textContent = msg;
        document.body.appendChild(t); setTimeout(() => t.remove(), 3000);
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        try {
            const res = await fetch(`${BASE_URL}/admin-login`, {
                method: 'POST', headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY },
                body: JSON.stringify({ password: document.getElementById('adminPassword').value })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'رمز اشتباه');
            adminToken = data.token;
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('adminSection').classList.remove('hidden');
            loadUsers(); loadManualNews();
        } catch (error) { showToast(error.message, true); }
    });

    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
            btn.classList.add('active'); document.getElementById('tab-' + btn.dataset.tab).classList.remove('hidden');
            if (btn.dataset.tab === 'list') loadManualNews();
            if (btn.dataset.tab === 'users') loadUsers();
        });
    });

    document.getElementById('addNewsForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const payload = {
            title: document.getElementById('newsTitle').value.trim(),
            source: document.getElementById('newsSource').value.trim(),
            category: document.getElementById('newsCategory').value,
            is_featured: document.getElementById('newsFeatured').value === 'true',
            content: document.getElementById('newsContent').value.trim(), published: true
        };
        try {
            const res = await fetch(`${BASE_URL}/manual-news`, {
                method: 'POST', headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${adminToken}` },
                body: JSON.stringify(payload)
            });
            if (!res.ok) throw new Error('خطا در ثبت');
            showToast('✅ ثبت شد'); document.getElementById('addNewsForm').reset();
        } catch (error) { showToast(error.message, true); }
    });

    async function loadManualNews() {
        const tbody = document.getElementById('newsTableBody'); tbody.innerHTML = '<tr><td colspan="3">بارگذاری...</td></tr>';
        const res = await fetch(`${BASE_URL}/manual-news?all=1`); const data = await res.json();
        tbody.innerHTML = data.map(n => `<tr><td>${n.title}</td><td>${n.is_featured ? '⭐ ویژه' : 'عادی'}</td><td><button class="btn-danger btn-sm" onclick="delNews('${n._id || n.id}')">حذف</button></td></tr>`).join('');
    }
    window.delNews = async (id) => {
        if (!confirm('حذف شود؟')) return;
        await fetch(`${BASE_URL}/manual-news?id=${id}`, { method: 'DELETE', headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${adminToken}` } });
        loadManualNews();
    };

    async function loadUsers() {
        const tbody = document.getElementById('usersListBody'); const select = document.getElementById('notifTarget');
        const res = await fetch(`${BASE_URL}/admin-users`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'list' }) });
        const users = await res.json();
        tbody.innerHTML = users.map(u => `<tr><td>${u}</td></tr>`).join('');
        select.innerHTML = '<option value="all">همه کاربران</option>' + users.map(u => `<option value="${u}">${u}</option>`).join('');
    }

    document.getElementById('sendNotifForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        await supabase.from('notifications').insert({
            target_user: document.getElementById('notifTarget').value,
            message: document.getElementById('notifMessage').value
        });
        showToast('✅ پیام ارسال شد'); document.getElementById('notifMessage').value = '';
    });

    document.getElementById('logoutBtn').onclick = () => location.reload();
</script>
</body>
</html>
