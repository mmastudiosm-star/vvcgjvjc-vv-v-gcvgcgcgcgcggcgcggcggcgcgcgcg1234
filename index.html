<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت | Lreporter</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #050810; --card-bg: #0f1525; --text: #f0f4f8; --text-muted: #8b9bb4;
            --accent: #3b82f6; --danger: #ef4444; --success: #10b981; --gold: #f59e0b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Vazirmatn', sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 40px 20px; }
        .container { width: 100%; max-width: 800px; }
        .card { background: var(--card-bg); border-radius: 16px; padding: 30px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 10px 30px rgba(0,0,0,0.5); margin-bottom: 20px; }
        h1 { text-align: center; margin-bottom: 30px; color: var(--accent); font-size: 1.5rem; }
        
        /* تب‌ها */
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn { flex: 1; padding: 12px; border-radius: 8px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: var(--text); font-family: inherit; font-weight: 700; cursor: pointer; transition: 0.3s; text-align: center; }
        .tab-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 8px; font-weight: 700; font-size: 0.9rem; color: var(--text-muted); }
        input, textarea, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.3); color: var(--text); font-family: inherit; font-size: 1rem; transition: 0.3s; }
        input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }
        textarea { min-height: 150px; resize: vertical; }
        
        button { width: 100%; padding: 14px; border: none; border-radius: 8px; background: var(--accent); color: #fff; font-weight: 700; font-family: inherit; font-size: 1rem; cursor: pointer; transition: 0.3s; }
        button:hover { opacity: 0.9; transform: translateY(-1px); }
        button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn-danger { background: var(--danger); }
        .btn-sm { padding: 6px 12px; font-size: 0.8rem; width: auto; }
        
        .hidden { display: none !important; }
        
        .toast { position: fixed; bottom: 20px; right: 20px; background: var(--card-bg); border: 1px solid var(--accent); padding: 15px 25px; border-radius: 10px; color: var(--text); font-weight: 700; z-index: 1000; animation: slideIn 0.3s; max-width: 90vw; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        /* آپلود عکس */
        .upload-zone { display: block; border: 2px dashed rgba(255,255,255,0.2); border-radius: 8px; padding: 20px; text-align: center; cursor: pointer; transition: 0.25s; background: rgba(0,0,0,0.2); }
        .upload-zone:hover { border-color: var(--accent); background: rgba(59,130,246,0.1); }
        #imgPreview { display: none; align-items: center; gap: 10px; margin-top: 10px; padding: 10px; background: rgba(0,0,0,0.3); border-radius: 8px; }
        #imgPreview img { width: 60px; height: 60px; object-fit: cover; border-radius: 6px; }

        /* لیست‌ها */
        .list-item { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.2); padding: 15px; border-radius: 8px; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body>

<div class="container">
    <!-- ۱. بخش ورود -->
    <div id="loginSection" class="card">
        <h1>🔐 ورود به پنل مدیریت</h1>
        <form id="loginForm">
            <div class="form-group">
                <label>رمز عبور مدیریت:</label>
                <input type="password" id="adminPassword" placeholder="رمز را وارد کنید..." required>
            </div>
            <button type="submit" id="loginBtn">ورود به پنل</button>
        </form>
    </div>

    <!-- ۲. پنل ادمین (بعد از ورود) -->
    <div id="adminSection" class="hidden">
        
        <!-- تب‌ها -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="add">➕ ثبت خبر</button>
            <button class="tab-btn" data-tab="list">📋 لیست اخبار</button>
            <button class="tab-btn" data-tab="users">👥 کاربران و پیام</button>
        </div>

        <!-- تب ثبت خبر -->
        <div id="tab-add" class="tab-content active">
            <div class="card">
                <h1>📰 ثبت خبر جدید</h1>
                <form id="addNewsForm">
                    <div class="form-group">
                        <label>عنوان خبر *</label>
                        <input type="text" id="newsTitle" required>
                    </div>
                    
                    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;">
                        <div class="form-group">
                            <label>منبع</label>
                            <input type="text" id="newsSource" value="خبر دستی">
                        </div>
                        <div class="form-group">
                            <label>دسته بندی</label>
                            <select id="newsCategory">
                                <option>عمومی</option><option>سیاسی</option><option>اقتصاد</option>
                                <option>ورزش</option><option>فناوری</option><option>سلامت</option>
                                <option>فرهنگ</option><option>حوادث</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>اهمیت</label>
                            <select id="newsFeatured" style="color: var(--gold); font-weight: bold;">
                                <option value="false" style="color: var(--text);">عادی</option>
                                <option value="true">⭐ ویژه (بالای سایت)</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>عکس خبر (اختیاری)</label>
                        <label for="imageFile" class="upload-zone" id="uploadZone">
                            <input type="file" id="imageFile" accept="image/*" hidden>
                            <span style="font-size: 1.5rem;">📸</span>
                            <div style="font-size: 0.9rem; margin-top: 5px;">برای انتخاب عکس کلیک کنید</div>
                        </label>
                        <div id="imgPreview">
                            <img id="imgPreviewTag" alt="پیش‌نمایش">
                            <div style="flex: 1; font-size: 0.8rem;" id="imgSizeInfo"></div>
                            <button type="button" id="removeImgBtn" class="btn-danger btn-sm">حذف</button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>متن خبر *</label>
                        <textarea id="newsContent" required></textarea>
                    </div>

                    <button type="submit" id="submitBtn">ثبت و انتشار خبر</button>
                </form>
            </div>
        </div>

        <!-- تب لیست اخبار -->
        <div id="tab-list" class="tab-content">
            <div class="card">
                <h1>📋 لیست اخبار دستی</h1>
                <div id="newsListContainer">در حال بارگذاری...</div>
            </div>
        </div>

        <!-- تب کاربران -->
        <div id="tab-users" class="tab-content">
            <div class="card" style="margin-bottom: 20px;">
                <h1 style="color: var(--gold);">✉️ ارسال پیام</h1>
                <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 10px;">
                    <div class="form-group">
                        <label>گیرنده:</label>
                        <select id="notifTarget"><option value="all">📢 همه کاربران</option></select>
                    </div>
                    <div class="form-group">
                        <label>متن پیام:</label>
                        <input type="text" id="notifMessage" placeholder="متن پیام...">
                    </div>
                </div>
                <button id="sendNotifBtn">ارسال پیام</button>
            </div>
            
            <div class="card">
                <h1>👥 لیست کاربران</h1>
                <div id="usersListContainer">در حال بارگذاری...</div>
            </div>
        </div>

        <button id="logoutBtn" class="btn-danger" style="margin-top: 10px;">خروج از حساب</button>
    </div>
</div>

<script>
    // ==========================================
    // ⚠️ تنظیمات اتصال
    // ==========================================
    const SUPABASE_ANON_KEY = 'sb_publishable_OsUd9T9GvvY6rvyycxlQSA_xFazoXBe'; 
    const BASE_URL = 'https://kemwkxuwhqgqqfyfpbmm.supabase.co/functions/v1';
    const ADMIN_LOGIN_URL = `${BASE_URL}/admin-login`;
    const MANUAL_NEWS_URL = `${BASE_URL}/manual-news`;
    const ADMIN_USERS_URL = `${BASE_URL}/admin-users`;

    let adminToken = null;
    let anImageBase64 = '';

    function showToast(msg, isError = false) {
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.style.borderColor = isError ? 'var(--danger)' : 'var(--success)';
        toast.textContent = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    // ==========================================
    // ۱. سیستم ورود (دقیقاً مثل کد کارآمد خودت)
    // ==========================================
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('loginBtn');
        const pass = document.getElementById('adminPassword').value;
        btn.textContent = 'در حال بررسی...';
        btn.disabled = true;

        try {
            const res = await fetch(ADMIN_LOGIN_URL, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'apikey': SUPABASE_ANON_KEY
                },
                body: JSON.stringify({ password: pass })
            });

            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'رمز عبور اشتباه است');

            adminToken = data.token;
            showToast('✅ ورود موفق!');
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('adminSection').classList.remove('hidden');
            document.getElementById('adminPassword').value = ''; 
            
            // لود کردن لیست‌ها در پس‌زمینه
            loadNewsList();
            loadUsers();
        } catch (error) {
            showToast('❌ ' + error.message, true);
        } finally {
            btn.textContent = 'ورود به پنل';
            btn.disabled = false;
        }
    });

    // ==========================================
    // ۲. تب‌ها
    // ==========================================
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
        });
    });

    // ==========================================
    // ۳. آپلود عکس (همون کد خودت)
    // ==========================================
    document.getElementById('imageFile').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const zone = document.getElementById('uploadZone');
        const originalHTML = zone.innerHTML;
        zone.innerHTML = '<div style="padding: 10px;">⏳ در حال پردازش...</div>';

        try {
            const base64 = await compressImage(file);
            anImageBase64 = base64;
            
            document.getElementById('imgPreviewTag').src = base64;
            document.getElementById('imgPreview').style.display = 'flex';
            zone.style.display = 'none';
            
            const bytes = Math.round(base64.length * 0.75);
            document.getElementById('imgSizeInfo').textContent = `حجم: ${(bytes / 1024).toFixed(0)} کیلوبایت`;
        } catch (err) {
            showToast('❌ ' + err.message, true);
            zone.innerHTML = originalHTML;
            e.target.value = '';
        }
    });

    function compressImage(file, maxW = 1280, maxH = 1280, quality = 0.82) {
        return new Promise((resolve, reject) => {
            if (!file.type.startsWith('image/')) return reject(new Error('فایل باید عکس باشد'));
            const reader = new FileReader();
            reader.onload = () => {
                const img = new Image();
                img.onload = () => {
                    let { width, height } = img;
                    if (width > maxW) { height = Math.round(height * maxW / width); width = maxW; }
                    if (height > maxH) { width = Math.round(width * maxH / height); height = maxH; }
                    const canvas = document.createElement('canvas');
                    canvas.width = width; canvas.height = height;
                    canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
                img.src = reader.result;
            };
            reader.readAsDataURL(file);
        });
    }

    document.getElementById('removeImgBtn').addEventListener('click', () => {
        anImageBase64 = '';
        document.getElementById('imgPreview').style.display = 'none';
        document.getElementById('uploadZone').style.display = 'block';
        document.getElementById('imageFile').value = '';
    });

    // ==========================================
    // ۴. ثبت خبر (با قابلیت ویژه)
    // ==========================================
    document.getElementById('addNewsForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!adminToken) return showToast('نشست منقضی شده است', true);

        const btn = document.getElementById('submitBtn');
        btn.textContent = '⏳ در حال ثبت...';
        btn.disabled = true;

        const payload = {
            title: document.getElementById('newsTitle').value.trim(),
            source: document.getElementById('newsSource').value.trim(),
            category: document.getElementById('newsCategory').value,
            is_featured: document.getElementById('newsFeatured').value === 'true',
            content: document.getElementById('newsContent').value.trim(),
            image: anImageBase64,
            published: true
        };

        try {
            const res = await fetch(MANUAL_NEWS_URL, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'apikey': SUPABASE_ANON_KEY,
                    'Authorization': `Bearer ${adminToken}`
                },
                body: JSON.stringify(payload)
            });

            if (!res.ok) {
                const errData = await res.json().catch(() => ({}));
                throw new Error(errData.error || 'خطا در ثبت خبر');
            }

            showToast('✅ خبر با موفقیت ثبت شد!');
            document.getElementById('addNewsForm').reset();
            document.getElementById('removeImgBtn').click();
            loadNewsList(); // آپدیت لیست

        } catch (error) {
            showToast('❌ ' + error.message, true);
        } finally {
            btn.textContent = 'ثبت و انتشار خبر';
            btn.disabled = false;
        }
    });

    // ==========================================
    // ۵. لیست اخبار و حذف
    // ==========================================
    async function loadNewsList() {
        const container = document.getElementById('newsListContainer');
        if(!container) return;
        container.innerHTML = 'در حال بارگذاری...';

        try {
            const res = await fetch(`${MANUAL_NEWS_URL}?all=1`, { headers: { 'apikey': SUPABASE_ANON_KEY } });
            const data = await res.json();

            if (!Array.isArray(data) || data.length === 0) {
                return container.innerHTML = '<p style="color:var(--text-muted); text-align:center;">هیچ خبری یافت نشد.</p>';
            }

            container.innerHTML = data.map(n => `
                <div class="list-item">
                    <div>
                        <div style="font-weight:bold; margin-bottom:5px;">${n.title}</div>
                        <div style="font-size:0.8rem; color:var(--text-muted);">${n.is_featured ? '⭐ ویژه' : 'عادی'}</div>
                    </div>
                    <button class="btn-danger btn-sm" data-id="${n._id || n.id}">حذف</button>
                </div>
            `).join('');

            container.querySelectorAll('button.btn-danger').forEach(btn => {
                btn.addEventListener('click', () => deleteNews(btn.dataset.id));
            });
        } catch (e) {
            container.innerHTML = '<p style="color:var(--danger); text-align:center;">خطا در دریافت.</p>';
        }
    }

    async function deleteNews(id) {
        if (!confirm('حذف شود؟')) return;
        try {
            await fetch(`${MANUAL_NEWS_URL}?id=${id}`, { 
                method: 'DELETE', 
                headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${adminToken}` } 
            });
            showToast('🗑 حذف شد');
            loadNewsList();
        } catch (e) { showToast('خطا در حذف', true); }
    }

    // ==========================================
    // ۶. کاربران و پیام
    // ==========================================
    async function loadUsers() {
        const container = document.getElementById('usersListContainer');
        const select = document.getElementById('notifTarget');
        if(!container) return;
        container.innerHTML = 'در حال بارگذاری...';

        try {
            const res = await fetch(ADMIN_USERS_URL, {
                method: 'POST', 
                headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY },
                body: JSON.stringify({ action: 'list' })
            });
            const users = await res.json();

            if (!Array.isArray(users) || users.length === 0) {
                return container.innerHTML = '<p style="color:var(--text-muted); text-align:center;">هنوز کاربری ثبت‌نام نکرده است.</p>';
            }

            container.innerHTML = users.map(u => `<div class="list-item">👤 ${u}</div>`).join('');
            select.innerHTML = '<option value="all">📢 همه کاربران</option>' + users.map(u => `<option value="${u}">${u}</option>`).join('');
        } catch (e) {
            container.innerHTML = '<p style="color:var(--danger); text-align:center;">خطا در دریافت کاربران.</p>';
        }
    }

    document.getElementById('sendNotifBtn').addEventListener('click', async () => {
        const target = document.getElementById('notifTarget').value;
        const message = document.getElementById('notifMessage').value.trim();
        if (!message) return showToast('پیام خالی است', true);

        try {
            await fetch(ADMIN_USERS_URL, {
                method: 'POST', 
                headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY },
                body: JSON.stringify({ action: 'notify', target: target, message: message })
            });
            showToast('✅ پیام ارسال شد');
            document.getElementById('notifMessage').value = '';
        } catch (e) { showToast('خطا در ارسال', true); }
    });

    // ==========================================
    // ۷. خروج
    // ==========================================
    document.getElementById('logoutBtn').addEventListener('click', () => {
        adminToken = null;
        document.getElementById('adminPassword').value = '';
        document.getElementById('loginSection').classList.remove('hidden');
        document.getElementById('adminSection').classList.add('hidden');
        showToast('از حساب خارج شدید');
    });
</script>

</body>
</html>
