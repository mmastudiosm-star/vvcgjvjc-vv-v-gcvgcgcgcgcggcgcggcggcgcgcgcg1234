<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت | Lreporter</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #050810; --card-bg: #0f1525; --text: #f0f4f8; --text-muted: #8b9bb4;
            --accent: #3b82f6; --danger: #ef4444; --success: #10b981; --gold: #f59e0b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Vazirmatn', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
        .hidden { display: none !important; }
        
        .login-container { display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: var(--card-bg); border-radius: 16px; padding: 30px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .login-card { width: 100%; max-width: 400px; }
        
        .admin-container { max-width: 1000px; margin: 0 auto; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; background: var(--card-bg); padding: 15px 25px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); }
        .header h1 { font-size: 1.2rem; color: var(--accent); }
        
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: var(--text); padding: 10px 20px; border-radius: 8px; cursor: pointer; font-family: inherit; font-weight: 700; transition: 0.3s; }
        .tab-btn.active { background: var(--accent); border-color: var(--accent); }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 8px; font-weight: 700; font-size: 0.9rem; color: var(--text-muted); }
        input, textarea, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.3); color: var(--text); font-family: inherit; font-size: 1rem; }
        input:focus, textarea:focus { outline: none; border-color: var(--accent); }
        textarea { min-height: 120px; resize: vertical; }
        
        button { padding: 12px 20px; border: none; border-radius: 8px; background: var(--accent); color: #fff; font-weight: 700; font-family: inherit; font-size: 1rem; cursor: pointer; transition: 0.3s; }
        button:hover { opacity: 0.9; }
        .btn-danger { background: var(--danger); }
        .btn-sm { padding: 6px 12px; font-size: 0.8rem; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .stat-box { background: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); text-align: center; }
        .stat-box h3 { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 10px; }
        .stat-box .value { font-size: 2rem; font-weight: 900; color: var(--accent); }

        .table-container { overflow-x: auto; background: var(--card-bg); border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); }
        table { width: 100%; border-collapse: collapse; text-align: right; }
        th, td { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        th { background: rgba(0,0,0,0.3); color: var(--accent); font-weight: 700; }
        tr:hover td { background: rgba(255,255,255,0.02); }

        .toast { position: fixed; bottom: 20px; right: 20px; background: var(--card-bg); border: 1px solid var(--accent); padding: 15px 25px; border-radius: 10px; font-weight: 700; z-index: 1000; animation: slideIn 0.3s; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    </style>
</head>
<body>

    <!-- صفحه ورود -->
    <div id="loginSection" class="login-container">
        <div class="card login-card">
            <h1 style="text-align: center; margin-bottom: 25px; color: var(--accent);">🔐 ورود به پنل مدیریت</h1>
            <form id="loginForm">
                <div class="form-group">
                    <label>رمز عبور مدیریت:</label>
                    <input type="password" id="adminPassword" placeholder="رمز را وارد کنید..." required>
                </div>
                <button type="submit" id="loginBtn" style="width: 100%;">ورود به پنل</button>
            </form>
        </div>
    </div>

    <!-- پنل اصلی -->
    <div id="adminSection" class="admin-container hidden">
        <div class="header">
            <h1>📊 مدیریت Lreporter</h1>
            <button id="logoutBtn" class="btn-danger btn-sm">خروج</button>
        </div>

        <div class="tabs">
            <button class="tab-btn active" data-tab="add">➕ ثبت خبر جدید</button>
            <button class="tab-btn" data-tab="list">📋 لیست اخبار دستی</button>
            <button class="tab-btn" data-tab="hide-news">🙈 مخفی کردن اخبار سایت</button>
            <button class="tab-btn" data-tab="users">👥 کاربران و پیام‌ها</button>
        </div>

        <!-- تب ۱: ثبت خبر -->
        <div id="tab-add" class="tab-content">
            <div class="card">
                <form id="addNewsForm">
                    <div class="form-group">
                        <label>عنوان خبر *</label>
                        <input type="text" id="newsTitle" required>
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;">
                        <div class="form-group">
                            <label>منبع</label>
                            <input type="text" id="newsSource" value="خبر دستی">
                        </div>
                        <div class="form-group">
                            <label>دسته بندی</label>
                            <select id="newsCategory">
                                <option>عمومی</option><option>سیاسی</option><option>اقتصاد</option>
                                <option>ورزش</option><option>فناوری</option><option>سلامت</option>
                                <option>فرهنگ</option><option>حوادث</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>اهمیت خبر (ویژه)</label>
                            <select id="newsFeatured">
                                <option value="false">عادی (مثل بقیه)</option>
                                <option value="true">⭐ ویژه (می‌رود بالای سایت)</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>عکس خبر (اختیاری)</label>
                        <label for="imageFile" class="upload-zone" id="uploadZone">
                            <input type="file" id="imageFile" accept="image/*" hidden>
                            <span style="font-size: 1.5rem;">📸</span>
                            <div style="font-size: 0.9rem; margin-top: 5px;">برای انتخاب عکس کلیک کنید</div>
                        </label>
                        <div id="imgPreview">
                            <img id="imgPreviewTag" alt="پیش‌نمایش" style="width: 60px; height: 60px; object-fit: cover; border-radius: 6px;">
                            <div style="flex: 1; font-size: 0.8rem;" id="imgSizeInfo"></div>
                            <button type="button" id="removeImgBtn" class="btn-danger btn-sm">حذف</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>متن خبر *</label>
                        <textarea id="newsContent" required></textarea>
                    </div>
                    <button type="submit" id="submitBtn" style="width: 100%;">ثبت خبر</button>
                </form>
            </div>
        </div>

        <!-- تب ۲: لیست اخبار دستی -->
        <div id="tab-list" class="tab-content hidden">
            <div class="table-container">
                <table>
                    <thead>
                        <tr><th>عنوان</th><th>نوع</th><th>عملیات</th></tr>
                    </thead>
                    <tbody id="newsTableBody"></tbody>
                </table>
            </div>
        </div>

        <!-- تب ۳: مخفی کردن اخبار سایت -->
        <div id="tab-hide-news" class="tab-content hidden">
            <div class="card">
                <p style="margin-bottom: 15px; color: var(--text-muted);">در اینجا می‌توانید اخباری که از سایت‌های دیگر می‌آیند را مخفی کنید تا در سایت اصلی نمایش داده نشوند.</p>
                <div id="scrapedNewsList" style="display: flex; flex-direction: column; gap: 10px;">
                    در حال بارگذاری...
                </div>
            </div>
        </div>

        <!-- تب ۴: کاربران و پیام‌ها -->
        <div id="tab-users" class="tab-content hidden">
            <div class="card" style="margin-bottom: 20px;">
                <h3 style="margin-bottom: 15px; color: var(--accent);">✉️ ارسال پیام (نوتیفیکیشن)</h3>
                <form id="sendNotifForm">
                    <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 10px;">
                        <div class="form-group">
                            <label>گیرنده:</label>
                            <select id="notifTarget">
                                <option value="all">همه کاربران</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>متن پیام:</label>
                            <input type="text" id="notifMessage" placeholder="پیام خود را بنویسید..." required>
                        </div>
                    </div>
                    <button type="submit" style="width: 100%;">ارسال پیام</button>
                </form>
            </div>
            <div class="card">
                <h3 style="margin-bottom: 15px; color: var(--accent);">👥 لیست کاربران</h3>
                <div class="table-container">
                    <table>
                        <thead><tr><th>نام کاربری</th></tr></thead>
                        <tbody id="usersListBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

<script>
    const SUPABASE_ANON_KEY = 'sb_publishable_OsUd9T9GvvY6rvyycxlQSA_xFazoXBe'; 
    const BASE_URL = 'https://kemwkxuwhqgqqfyfpbmm.supabase.co/functions/v1';
    const ADMIN_LOGIN_URL = `${BASE_URL}/admin-login`;
    const MANUAL_NEWS_URL = `${BASE_URL}/manual-news`;
    const SCRAPED_NEWS_URL = `${BASE_URL}/rapid-processor`;
    const ADMIN_USERS_URL = `${BASE_URL}/admin-users`;
    const HIDDEN_NEWS_URL = `${BASE_URL}/hidden-news`;

    let adminToken = null;
    let anImageBase64 = '';

    function showToast(msg, isError = false) {
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.style.borderColor = isError ? 'var(--danger)' : 'var(--success)';
        toast.textContent = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    // ورود
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('loginBtn'); btn.disabled = true;
        try {
            const res = await fetch(ADMIN_LOGIN_URL, {
                method: 'POST', headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY },
                body: JSON.stringify({ password: document.getElementById('adminPassword').value })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'رمز اشتباه است');
            adminToken = data.token;
            showToast('✅ ورود موفق');
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('adminSection').classList.remove('hidden');
            loadUsers();
            loadManualNews();
        } catch (error) { showToast('❌ ' + error.message, true); } 
        finally { btn.disabled = false; }
    });

    // تب‌ها
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
            btn.classList.add('active');
            document.getElementById('tab-' + btn.dataset.tab).classList.remove('hidden');
            
            if (btn.dataset.tab === 'list') loadManualNews();
            if (btn.dataset.tab === 'users') loadUsers();
            if (btn.dataset.tab === 'hide-news') loadScrapedNews();
        });
    });

    // آپلود عکس
    document.getElementById('imageFile').addEventListener('change', async (e) => {
        const file = e.target.files[0]; if (!file) return;
        document.getElementById('uploadZone').style.display = 'none';
        document.getElementById('imgPreview').style.display = 'flex';
        document.getElementById('imgPreviewTag').src = URL.createObjectURL(file);
        
        const reader = new FileReader();
        reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                let width = img.width, height = img.height;
                if (width > 1280) { height = Math.round(height * 1280 / width); width = 1280; }
                canvas.width = width; canvas.height = height;
                canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                anImageBase64 = canvas.toDataURL('image/jpeg', 0.82);
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    });
    document.getElementById('removeImgBtn').onclick = () => {
        anImageBase64 = ''; document.getElementById('uploadZone').style.display = 'block';
        document.getElementById('imgPreview').style.display = 'none'; document.getElementById('imageFile').value = '';
    };

    // ثبت خبر
    document.getElementById('addNewsForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn'); btn.disabled = true;
        const payload = {
            title: document.getElementById('newsTitle').value.trim(),
            source: document.getElementById('newsSource').value.trim(),
            category: document.getElementById('newsCategory').value,
            is_featured: document.getElementById('newsFeatured').value === 'true',
            content: document.getElementById('newsContent').value.trim(),
            image: anImageBase64, published: true
        };
        try {
            const res = await fetch(MANUAL_NEWS_URL, {
                method: 'POST', headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${adminToken}` },
                body: JSON.stringify(payload)
            });
            if (!res.ok) throw new Error('خطا در ثبت');
            showToast('✅ خبر ثبت شد'); document.getElementById('addNewsForm').reset(); document.getElementById('removeImgBtn').click();
        } catch (error) { showToast('❌ ' + error.message, true); } finally { btn.disabled = false; }
    });

    // لود لیست اخبار دستی
    async function loadManualNews() {
        const tbody = document.getElementById('newsTableBody'); tbody.innerHTML = '<tr><td colspan="3">بارگذاری...</td></tr>';
        try {
            const res = await fetch(`${MANUAL_NEWS_URL}?all=1`, { headers: { 'apikey': SUPABASE_ANON_KEY } });
            const data = await res.json();
            tbody.innerHTML = data.map(n => `
                <tr>
                    <td>${n.title}</td>
                    <td>${n.is_featured ? '⭐ ویژه' : 'عادی'}</td>
                    <td><button class="btn-danger btn-sm" onclick="deleteManualNews('${n._id || n.id}')">حذف</button></td>
                </tr>
            `).join('') || '<tr><td colspan="3">خبری نیست</td></tr>';
        } catch (e) { tbody.innerHTML = '<tr><td colspan="3">خطا</td></tr>'; }
    }

    // حذف خبر دستی
    window.deleteManualNews = async (id) => {
        if (!confirm('حذف شود؟')) return;
        await fetch(`${MANUAL_NEWS_URL}?id=${id}`, { method: 'DELETE', headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${adminToken}` } });
        loadManualNews();
    };

    // لود کاربران
    async function loadUsers() {
        const tbody = document.getElementById('usersListBody');
        const select = document.getElementById('notifTarget');
        tbody.innerHTML = '<tr><td>بارگذاری...</td></tr>';
        try {
            const res = await fetch(ADMIN_USERS_URL, {
                method: 'POST', headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY },
                body: JSON.stringify({ action: 'list' })
            });
            const users = await res.json();
            tbody.innerHTML = users.map(u => `<tr><td>${u}</td></tr>`).join('');
            select.innerHTML = '<option value="all">همه کاربران</option>' + users.map(u => `<option value="${u}">${u}</option>`).join('');
        } catch (e) { tbody.innerHTML = '<tr><td>خطا در دریافت</td></tr>'; }
    }

    // ارسال پیام
    document.getElementById('sendNotifForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const target = document.getElementById('notifTarget').value;
        const message = document.getElementById('notifMessage').value;
        try {
            await fetch(ADMIN_USERS_URL, {
                method: 'POST', headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY },
                body: JSON.stringify({ action: 'notify', target, message })
            });
            showToast('✅ پیام ارسال شد'); document.getElementById('notifMessage').value = '';
        } catch (e) { showToast('خطا', true); }
    });

    // لود اخبار غیردستی (برای مخفی کردن)
    async function loadScrapedNews() {
        const container = document.getElementById('scrapedNewsList');
        container.innerHTML = 'در حال بارگذاری...';
        try {
            // گرفتن اخبار اصلی سایت
            const [resScraped, resHidden] = await Promise.all([
                fetch(SCRAPED_NEWS_URL, { headers: { 'apikey': SUPABASE_ANON_KEY } }).then(r => r.json()),
                fetch(HIDDEN_NEWS_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'list' }) }).then(r => r.json())
            ]);
            
            const hiddenLinks = resHidden || [];
            
            if (!resScraped || resScraped.length === 0) {
                container.innerHTML = 'خبری یافت نشد.'; return;
            }

            container.innerHTML = resScraped.map(n => {
                const isHidden = hiddenLinks.includes(n.link);
                return `
                <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.1);">
                    <span style="font-size: 0.9rem;">${n.title}</span>
                    ${isHidden 
                        ? `<button class="btn-sm" style="background:var(--success)" onclick="toggleHide('${n.link}', 'unhide')">نمایش مجدد</button>`
                        : `<button class="btn-sm btn-danger" onclick="toggleHide('${n.link}', 'hide')">مخفی کردن</button>`
                    }
                </div>`;
            }).join('');
        } catch (e) { container.innerHTML = 'خطا در دریافت'; }
    }

    // مخفی یا نمایان کردن اخبار
    window.toggleHide = async (link, action) => {
        await fetch(HIDDEN_NEWS_URL, {
            method: 'POST', headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY },
            body: JSON.stringify({ action, link })
        });
        loadScrapedNews();
    };

    document.getElementById('logoutBtn').onclick = () => location.reload();
</script>
</body>
</html>
